name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Real GNU tools for the differential test (gawk replaces mawk as awk,
      # bsdextrautils provides column)
      - run: sudo apt-get update && sudo apt-get install -y gawk bsdextrautils
      - run: npm test
      - run: npm run test:diff
